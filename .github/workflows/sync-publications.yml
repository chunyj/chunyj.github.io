name: Sync publications from Semantic Scholar

on:
  schedule:
    - cron: "0 13 * * 1" # every Monday 13:00 UTC
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Run sync script 🔄
        run: python3 scripts/sync_publications.py

      - name: Create pull request if new publications found 📬
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Add new publications from Semantic Scholar"
          title: "New publication(s) found on Semantic Scholar"
          body: |
            Automated sync found publication(s) not yet in `_bibliography/papers.bib`.

            New entries are appended with a `needs_review = {true}` field —
            please double check the `abbr`, add a `preview` image, and set
            `selected` before merging, then remove that field.
          branch: sync-publications
          add-paths: _bibliography/papers.bib

name: Sync resume PDF from Overleaf

on:
  schedule:
    - cron: "0 13 1 1,7 *" # Jan 1 and Jul 1, 13:00 UTC (every 6 months)
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout site repo 🛎️
        uses: actions/checkout@v4

      - name: Clone Overleaf project 📥
        env:
          OVERLEAF_GIT_TOKEN: ${{ secrets.OVERLEAF_GIT_TOKEN }}
        run: |
          git clone "https://git:${OVERLEAF_GIT_TOKEN}@git.overleaf.com/67037d852d13c6b46059eead" overleaf-resume

      - name: Compile resume PDF 🖨️
        uses: xu-cheng/latex-action@v3
        with:
          root_file: overleaf-resume/resume.tex

      - name: Copy compiled PDF into site ✂️
        run: cp overleaf-resume/resume.pdf assets/pdf/resume.pdf

      - name: Create pull request if resume changed 📬
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Update resume.pdf from Overleaf"
          title: "Resume updated from Overleaf"
          body: |
            Automated sync pulled the latest source from Overleaf and recompiled the resume PDF.

            This only updates `assets/pdf/resume.pdf`. If the content changed
            (new job, new publication, new award), remember to also update
            `_data/cv.yml` by hand so the on-page CV matches.
          branch: sync-resume
          add-paths: assets/pdf/resume.pdf
